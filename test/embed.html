<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embed test harness</title>
  <link rel="icon" href="data:,">
  <style>
    body { margin: 0; font: 16px/1.5 Georgia, serif; color: #333; background: #faf7f2; }
    .site { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
    .site h1 { font-size: 2rem; }
    .note { font-size: 0.9rem; color: #666; }
    code { background: #eee; padding: 1px 4px; }
  </style>
</head>
<body>
  <div class="site">
    <h1>A page that stands in for the Tithely site</h1>
    <p>Paragraph text above the embed block, styled unlike the map, to confirm the iframe isolates the map's styles.</p>

    <!-- The production snippet, with src pointed at the local copy and the
         origin check widened to this page's own origin. Everything else is
         identical to README.md. -->
    <iframe
      id="org-heatmap"
      src="../index.html"
      title="Map of partner organizations by country and region"
      width="100%"
      style="height: clamp(360px, 70vh, 720px); border: 0; display: block;"
      loading="lazy"></iframe>
    <script>
      (function () {
        var frame = document.getElementById("org-heatmap");
        var allowed = ["https://lsibruce.github.io", location.origin];
        window.addEventListener("message", function (ev) {
          if (allowed.indexOf(ev.origin) < 0) return;
          if (!ev.data || ev.data.type !== "org-heatmap:height") return;
          var h = Number(ev.data.height);
          if (frame && h >= 300 && h <= 2000) frame.style.height = h + "px";
          window.__lastRequestedHeight = h;
          report();
        });
      })();
    </script>

    <p class="note">Frame height in use: <code id="h">?</code></p>
    <p>Paragraph text below the embed block.</p>
  </div>

  <script>
    var out = document.getElementById("h");
    function report() {
      var f = document.getElementById("org-heatmap");
      var h = window.__lastRequestedHeight;
      out.textContent = (f.getBoundingClientRect().height | 0) + "px" + (h ? " (map asked for " + h + "px)" : " (no message received yet)");
    }
    new ResizeObserver(report).observe(document.getElementById("org-heatmap"));
    report();
  </script>
</body>
</html>
